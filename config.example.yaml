credentials:
  profiles:
    c9800-admin:
      username: "netops-admin"
      password_keyring: "wifiops:profile:c9800-admin:password"
      enable_keyring: "wifiops:profile:c9800-admin:enable"

wlc:
  host: "192.0.2.10"
  credential_profile: "c9800-admin"

# Multi-WLC-aware commands such as `wifiops c9800 ap-ports` use `wlcs:`
# when present. Keep `wlc:` for commands that still target a single WLC.
wifiops:
  wlc_concurrency: 3

wlcs:
  - name: "mby-1"
    host: "192.0.2.10"
    credential_profile: "c9800-admin"
  - name: "mby-2"
    host: "192.0.2.11"
    credential_profile: "c9800-admin"

ap:
  credential_profile: "c9800-admin"

# Plaintext username/password/enable values still work for local-only
# compatibility, but credential profiles keep secrets out of config.yaml.

local:
  ping_host: "8.8.8.8"
  sound_alerts: true
  # Optional override. Leave blank to auto-detect the repo-owned macOS helper
  # installed by scripts/build-macos-wifi-identity-helper.sh.
  identity_helper_path: ""

ap_balance:
  refresh_seconds: 30
  include: []
  exclude: []
  included_slots: []
  excluded_slots: []
  only_imbalanced: false
  display_columns: 1
  auto_exclude_admin_down_slots: false
  min_total_clients: 1
  imbalance:
    ratio_threshold: 10
    min_difference: 20
    include_zero_client_slots: true

ap_ports:
  include: []
  exclude: []
  show_all: false
  speed_threshold: 1000

ap_filesystems:
  include: []
  exclude: []
  min_used_percent: 95
  show_all: false
  ap_concurrency: 20
